<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvelle Microclean</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="banner" aria-label="Nuvelle Microclean - Twój nowy ręcznik do rąk">
    <img src="1.jpg" alt="Nuvelle Microclean - ręcznik zamiast bawełnianego ręcznika do rąk">

    <div class="banner-overlay">

      <div class="pill pill-top-right">
        <svg class="pill-drop" viewBox="0 0 24 32" aria-hidden="true">
          <path d="M12 0C12 0 2 14 2 21a10 10 0 0 0 20 0C22 14 12 0 12 0Z" fill="#c6e21e"/>
          <path d="M8 21a4 4 0 0 0 4 4" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>
        <p class="pill-label">Formuła</p>
        <p class="pill-brand">Microclean</p>
        <p class="pill-sub">Wsparcie codziennej<br>higieny i świeżości</p>
      </div>

      <div class="info-card">
        <p class="tagline">
          <span class="line1">Twój nowy</span>
          <span class="line2">ręcznik do rąk.</span>
        </p>
        <p class="desc">Zastąp swój bawełniany ręcznik i poznaj nowy sposób osuszania rąk.</p>
        <div class="btn-row">
          <button type="button" class="btn btn-solid">Poznaj Microclean</button>
          <button type="button" class="btn btn-outline">Kup online</button>
        </div>
        <p class="mini-tag">Po myciu? Microclean.</p>
      </div>

      <div class="scent-tag">
        <span class="scent-small">Świeży zapach</span>
        <span class="scent-big">Limonki</span>
        <span class="scent-small2">i smoczego owocu</span>
      </div>

    </div>
  </section>

</body>
</html>
