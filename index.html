<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvelle Microclean</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="banner" aria-label="Nuvelle Microclean - Twój nowy ręcznik do rąk">
    <img src="1.jpg" alt="Nuvelle Microclean - ręcznik zamiast bawełnianego ręcznika do rąk">
    <div class="banner-overlay">

      <div class="pill pill-top-right">
        <div class="pill-icon">💧</div>
        <div class="pill-label">Formuła<br>Microclean</div>
        <div class="pill-sub">Wsparcie codziennej higieny i świeżości</div>
      </div>

      <div class="info-card">
        <p class="eyebrow">Nuvelle</p>
        <p class="brand-line">Microclean</p>
        <p class="tagline">Twój nowy ręcznik do rąk.</p>
        <p class="desc">Zastąp swój bawełniany ręcznik i poznaj nowy sposób osuszania rąk.</p>
        <div class="btn-row">
          <a href="#" class="btn btn-solid">Poznaj Microclean</a>
          <a href="#" class="btn btn-outline">Kup online</a>
        </div>
      </div>

      <div class="scent-tag">
        <span class="scent-small">Świeży zapach</span>
        <span class="scent-big">Limonki<br>i smoczego owocu</span>
      </div>

      <p class="mini-tag">Po myciu? Microclean.</p>
    </div>
  </section>

</body>
</html>
